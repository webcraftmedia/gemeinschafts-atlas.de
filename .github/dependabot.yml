version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 99
    groups:
      # Vitest and its coverage provider are version-locked to each other, and
      # @nuxt/test-utils pins the vitest it was built against — a PR that moves
      # only one of them cannot install.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@nuxt/test-utils"
      # @size-limit/file peer-pins size-limit to the exact same version.
      size-limit:
        patterns:
          - "size-limit"
          - "@size-limit/*"
      # The Vite plugin and the framework itself ship as one release.
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 99

  # Die Images in docker-compose.yml (PostGIS). Ein Postgres-Minor, den hier
  # niemand mitnimmt, ist genau die Art von Drift, die später als "bei mir lief
  # es" auffällt.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 99

  # Das Basis-Image in app/Dockerfile.
  - package-ecosystem: "docker"
    directory: "/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 99
