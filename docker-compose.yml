# Der Stack des Gemeinschafts-Atlas.
#
# Diese Datei beschreibt den produktionsnahen Zustand: die App als gebautes
# Artefakt. `docker compose up` zieht lokal zusätzlich docker-compose.override.yml
# und ersetzt die App durch den Dev-Server mit Hot Reload — die Override-Datei
# wird automatisch gemerged, ohne sie zu nennen.
#
#   docker compose up -d                      Entwicklung (mit Override)
#   docker compose -f docker-compose.yml up   produktionsnah, ohne Override
#   docker compose down                       anhalten, Daten bleiben
#   docker compose down -v                    anhalten und Daten wegwerfen
services:
  app:
    # Der Name ist bewusst kein existierendes Repository: sonst zieht Compose
    # das Image von dort, statt es hier aus dem Dockerfile zu bauen.
    image: webcraftmedia/gemeinschafts-atlas:local-production
    build:
      context: ./app
      target: production
    restart: unless-stopped
    ports:
      # Innen wie außen 3000 — dieselbe Nummer, die Nuxt beim Start ausgibt.
      # Weicht das ab, schickt die Logzeile jeden auf eine URL, die es nicht
      # gibt.
      # Kollidiert bewusst mit dem Host-Dev-Server (`cd app && npm run dev`)
      # und mit anderen Projekten auf 3000: beides sind Wege, *diese* App zu
      # starten, und zwei davon gleichzeitig will man selten. Wenn doch:
      #   APP_PORT=3002 docker compose up -d
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost:${APP_PORT:-3000}}
      NUXT_PUBLIC_CONTACT_EMAIL: ${NUXT_PUBLIC_CONTACT_EMAIL:-kontakt@gemeinschafts-atlas.de}
    # Kein depends_on auf postgres: die Anwendung spricht noch nicht mit der
    # Datenbank. Die Kopplung kommt, wenn es Datenzugriff gibt — vorher wäre
    # sie eine Behauptung.

  postgres:
    # PostGIS statt nacktem Postgres: ein Atlas ist Geodaten. Umkreissuche,
    # Bounding-Box-Abfragen fürs Kartenfenster und Marker-Clustering sind hier
    # indizierte Standardoperationen (GiST auf `geography`) statt Handarbeit.
    # Das Image legt die Extension beim ersten Start selbst in POSTGRES_DB an.
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-atlas}
      POSTGRES_USER: ${DB_USER:-atlas}
      # Entwicklungswert, bewusst im Repo. Produktion läuft nicht über diese
      # Datei, sondern über app/.env auf dem Server.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-atlas}
    ports:
      # Nur auf Loopback. Ohne die 127.0.0.1 davor bindet Docker auf allen
      # Interfaces und hängt die Datenbank am Netz — auch an einem, in dem du
      # sie nicht erwartest.
      # Nicht der Standardport 5432, damit eine System-Postgres oder ein
      # anderes Projekt nicht kollidiert; über DB_PORT verschiebbar.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      # Benanntes Volume, kein Bind-Mount: ein `./data`-Mount legt ein
      # root-eigenes Verzeichnis im Repo an, das weder .gitignore noch `rm`
      # ohne sudo wieder loswird.
      - postgres-data:/var/lib/postgresql/data
    # Postgres' Parallel-Query braucht mehr Shared Memory als Dockers 64 MB.
    shm_size: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-atlas} -d ${DB_DATABASE:-atlas}"]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
